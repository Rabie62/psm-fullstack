<div class="min-vh-100 d-flex align-items-center justify-content-center bg-gradient-primary py-5">
  <div class="col-md-6 col-lg-5">
    <div class="argon-card p-4">
      <div class="text-center mb-4">
        <h3 class="fw-bold text-dark">Inscription PSM</h3>
        <p class="text-muted small">Une notification email sera automatiquement envoyée à l'administrateur</p>
      </div>

      @if (successMessage()) {
        <div class="alert alert-success">{{ successMessage() }}</div>
      }
      @if (errorMessage()) {
        <div class="alert alert-danger">{{ errorMessage() }}</div>
      }

      <form (ngSubmit)="registerUser()">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label">Nom</label>
            <input type="text" class="form-control" [(ngModel)]="user.nom" name="nom" required>
          </div>
          <div class="col-md-6 mb-3">
            <label class="form-label">Prénom</label>
            <input type="text" class="form-control" [(ngModel)]="user.prenom" name="prenom" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" class="form-control" [(ngModel)]="user.email" name="email" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Téléphone</label>
          <input type="text" class="form-control" [(ngModel)]="user.tel" name="tel" required>
        </div>

        <div class="mb-3">
          <label class="form-label">Mot de passe (min. 8 caractères)</label>
          <input type="password" class="form-control" [(ngModel)]="user.password" name="password" minlength="8" required>
        </div>

        <div class="mb-4">
          <label class="form-label">Rôle souhaité</label>
          <select class="form-select" [(ngModel)]="user.role" name="role">
            <option value="COLLABORATEUR">COLLABORATEUR (Consultation et Ajout)</option>
            <option value="ADMIN">ADMIN (Accès complet CRUD)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-argon-primary w-100 py-2 mb-3">
          <i class="fas fa-user-check me-1"></i> S'inscrire
        </button>

        <div class="text-center">
          <a routerLink="/login" class="text-primary text-decoration-none small">Retour à la connexion</a>
        </div>
      </form>
    </div>
  </div>
</div>
