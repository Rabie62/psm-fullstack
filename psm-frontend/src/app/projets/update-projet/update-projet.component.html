<div class="argon-card col-lg-8 mx-auto">
  <div class="argon-card-header">
    <h5 class="mb-0 fw-bold text-dark"><i class="fas fa-edit text-warning me-2"></i>Modifier le Projet : {{ projet.libelle }}</h5>
  </div>
  <div class="p-4">
    <form (ngSubmit)="updateProjet()">
      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label">Libellé du Projet</label>
          <input type="text" class="form-control" [(ngModel)]="projet.libelle" name="libelle" required>
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label">Client Associé</label>
          <select class="form-select" [(ngModel)]="selectedClientId" name="selectedClientId" required>
            @for (c of clients(); track c.id) {
              <option [ngValue]="c.id">{{ c.nom }} ({{ c.email }})</option>
            }
          </select>
        </div>
      </div>

      <div class="row">
        <div class="col-md-4 mb-3">
          <label class="form-label">Budget (TND)</label>
          <input type="number" class="form-control" [(ngModel)]="projet.budget" name="budget" required>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Durée</label>
          <input type="text" class="form-control" [(ngModel)]="projet.duree" name="duree" required>
        </div>
        <div class="col-md-4 mb-3">
          <label class="form-label">Statut</label>
          <select class="form-select" [(ngModel)]="projet.statut" name="statut">
            <option value="EN_ATTENTE">EN_ATTENTE</option>
            <option value="EN_COURS">EN_COURS</option>
            <option value="TERMINE">TERMINE</option>
            <option value="EN_RETARD">EN_RETARD</option>
          </select>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label">Description</label>
        <textarea class="form-control" rows="3" [(ngModel)]="projet.description" name="description"></textarea>
      </div>

      <div class="mb-4">
        <label class="form-label d-block">Cahier des charges (Document)</label>
        @if (projet.documentCahierCharges) {
          <div class="mb-2 d-flex align-items-center gap-2">
            <a [href]="getDocumentDownloadUrl()" target="_blank" class="btn btn-sm btn-outline-info">
              <i class="fas fa-file-download me-1"></i> Télécharger le document actuel
            </a>
          </div>
        }
        <input type="file" class="form-control" (change)="onFileSelected($event)">
        <small class="text-muted">Sélectionnez un nouveau document pour remplacer le cahier des charges existant.</small>
      </div>

      <button type="submit" class="btn btn-argon-primary me-2">Mettre à jour</button>
      <a routerLink="/listProjet" class="btn btn-outline-secondary">Annuler</a>
    </form>
  </div>
</div>
