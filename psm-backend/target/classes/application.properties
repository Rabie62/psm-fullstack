spring.application.name=psm
server.port=${PORT:8081}
server.servlet.encoding.charset=UTF-8
logging.charset.console=UTF-8

# ==============================================================
# Configuration MySQL & JPA / Hibernate
# ==============================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/psmdb?useUnicode=true&useJDBCCompliantTimezoneShift=true&useLegacyDatetimeCode=false&serverTimezone=UTC&createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Rabiestar@2003}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==============================================================
# Configuration JWT (JSON Web Token)
# ==============================================================
psm.jwt.secret=SmartSoftSolutionsProjectsManagerSecretKey2024ForHS512AlgorithmMinimumLength64Bytes!
psm.jwt.expiration-ms=18000000

# ==============================================================
# Configuration SMTP (Envoi d'email à l'Admin après inscription)
# ==============================================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:rabiae.ibenltaief@ensi-uma.tn}
spring.mail.password=${MAIL_PASSWORD:zogb mwwj eugn tlds}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Email de l'administrateur recevant les notifications d'inscription
psm.admin.email=${ADMIN_EMAIL:rabi3beltaief2023@gmail.com}

# ==============================================================
# Ressources statiques (Distribution Angular dans static/)
# ==============================================================
spring.web.resources.static-locations[0]=file:src/main/resources/static/
spring.web.resources.static-locations[1]=classpath:/static/

# ==============================================================
# Configuration Upload Multipart (Documents & Logos)
# ==============================================================
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=30MB
